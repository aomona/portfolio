name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'cloudflare-production' || 'cloudflare-preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_DEPLOY_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    outputs:
      preview_url: ${{ steps.preview.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build static assets
        run: npm run cf:build
      - name: Deploy static assets to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.'
            exit 1
          fi
          npm run deploy
      - name: Verify preview URL
        if: env.CLOUDFLARE_DEPLOY_TARGET == 'preview'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/subdomain`, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
          });
          const data = await response.json();
          if (!response.ok || !data.success || !data.result?.subdomain) throw new Error('Cannot resolve Workers preview subdomain.');
          const url = `https://aomona-portfolio-preview.${data.result.subdomain}.workers.dev`;
          let verified = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            const page = await fetch(url).catch(() => null);
            if (page?.ok && (await page.text()).includes('FP002119-person.webp')) { verified = true; break; }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!verified) throw new Error('Preview did not serve the photo layers after deployment.');
          appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Preview: ${url}\n`);
          JS
  preview-link:
    if: github.ref != 'refs/heads/main'
    needs: deploy
    name: Preview ${{ needs.deploy.outputs.preview_url }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Preview URL verified.'
